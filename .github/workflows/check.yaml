# R CMD check for tabularberg. Push/PR: Ubuntu, cloud tier (cheap).
# Manual run (workflow_dispatch): the OS x tier matrix.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      matrix:
        description: "Run the full OS x tier matrix"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.tier }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        tier: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["minimal","cloud","full"]') || fromJSON('["cloud"]') }}
    env:
      ICECHUNK_FEATURES: ${{ matrix.tier }}
      ICECHUNK_EXPECT_TIER: ${{ matrix.tier }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust toolchain
        run: rustc --version && cargo --version
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # Fixtures written by icechunk-python (fixtures/README.md), for
      # test-fixtures-read.R. Linux only for now: never run on macOS or
      # Windows (file:// container paths there are untested), so they skip.
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Linux'
      - name: Build fixtures
        if: runner.os == 'Linux'
        run: |
          uv run --no-project --python 3.12 --with "icechunk==2.3.*" --with "zarr>=3" --with numpy --with h5py python -I fixtures/make_fixtures.py
          uv run --no-project --python 3.12 --with "icechunk<2" --with "zarr>=3" --with numpy python -I fixtures/make_fixtures.py --v1
          echo "ICECHUNK_R_FIXTURES=$GITHUB_WORKSPACE/fixtures" >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
