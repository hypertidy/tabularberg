# pkgdown site for tabularberg, https://hypertidy.github.io/tabularberg/
#
# Builds and deploys on push to main. A manual run
# (Actions > pkgdown > Run workflow) builds the site and uploads it as an
# artifact; it deploys only if "deploy" is ticked.
#
# The site deploys straight from the artifact (Pages source "GitHub
# Actions"), so there is no gh-pages branch and no committed docs/ folder.
name: pkgdown

on:
  # No release trigger: the github-pages environment allows deploys from
  # main only (a release runs on its tag), and the push to main that a
  # release tags has already deployed.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (Pages must be enabled)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The default install tier, so ic_compiled_features() in the
      # reference pages shows what a user gets.
      ICECHUNK_FEATURES: cloud
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      # Examples and both vignettes run offline: the main vignette is
      # precomputed, the byterefs one uses ic_example_repo().
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
