# pkgdown site for icechunkr.
#
# Today: manual only (Actions > pkgdown > Run workflow). Every run builds
# the site and uploads it as an artifact you can download and inspect.
# Deployment happens only if you tick "deploy", and it fails until Pages is
# on (Settings > Pages > Source: "GitHub Actions").
#
# To go live (`url:` in _pkgdown.yml is already set):
#   1. turn on Pages with source "GitHub Actions";
#   2. uncomment the push/release triggers below (deploys then happen on
#      push to main and on release).
#
# The site deploys straight from the artifact, so there is no gh-pages
# branch and no committed docs/ folder (docs/ stays in .gitignore).
name: pkgdown

on:
  # push:
  #   branches: [main]
  # release:
  #   types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (Pages must be enabled)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The default install tier, so ic_compiled_features() in the
      # reference pages shows what a user gets.
      ICECHUNK_FEATURES: cloud
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      # Examples and both vignettes run offline: the main vignette is
      # precomputed, the byterefs one uses ic_example_repo().
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
